# \u5DE5\u7A0B\u7684maven\u5750\u6807\uFF0C\u751F\u6210\u4EE3\u7801\u65F6\u4F1A\u8FDB\u884C\u66FF\u6362\uFF0C\u6CE8\u610F:
#   1. \u539F\u578B\u2F2F\u7A0B\u7684groupId\uFF0C\u9700\u8981\u548Cpom.xml\u2F42\u4EF6\u4E2D<groupId>xxx</groupId>\u6807\u7B7E\u7684\u503C\u4FDD\u6301\u2F00\u81F4
#   2. \u539F\u578B\u2F2F\u7A0B\u7684artifactId\uFF0C\u9700\u8981\u548Cpom.xml\u2F42\u4EF6\u4E2D<artifactId>xxx</artifactId>\u6807\u7B7E\u7684\u503C\u4FDD\u6301\u2F00\u81F4
#   3. \u539F\u578B\u2F2F\u7A0B\u7684\u7248\u672C\uFF0C\u9700\u8981\u548Cpom.xml\u2F42\u4EF6\u4E2D<version>xxx</version>\u6807\u7B7E\u7684\u503C\u4FDD\u6301\u2F00\u81F4
#   4.  \u2F2F\u7A0B\u542F\u52A8\u7C7B\uFF0C\u9700\u8981\u548Cspring\u63D2\u4EF6\u4E2D<mainClass>xxxx</mainClass>\u4FDD\u6301\u2F00\u81F4\uFF0C\u9ED8\u8BA4\u662F${archetype.groupId}.Application,\u8FD0\u2F8F\u65F6${archetype.groupId}\u2F83\u52A8\u66FF\u6362
archetype.groupId=com.netease.cloud
archetype.artifactId=low-code-app-archetype
archetype.version=1.0-SNAPSHOT
archetype.mainClass=${archetype.groupId}.Application

# \u2F2F\u7A0B\u521D\u59CB\u5316\u65F6\u54EA\u4E9B\u540E\u7F00\u540D\u7684\u2F42\u4EF6\u9700\u8981\u8FDB\u2F8Fpackage\u66FF\u6362\uFF0C\u9ED8\u8BA4.xml\u548C.java
archetype.filteredExtensions=java,xml
# \u2F2F\u7A0B\u521D\u59CB\u5316\u65F6\u54EA\u4E9B\u2F42\u4EF6\u9700\u8981\u8FDB\u2F8Fpackage\u66FF\u6362\uFF0C\u2F40\u6301\u901A\u914D\u7B26\u6307\u5B9A
#archetype.filteredPatterns=/**/.java
# \u5B9A\u4E49\u54EA\u4E9B\u2F42\u4EF6\u4E0D\u9700\u8981\u8FDB\u2F8F\u66FF\u6362\uFF0C\u4EE3\u7801\u2F63\u6210\u65F6\u53EA\u4F1A\u505A\u2F42\u4EF6\u62F7\u2EC9
archetype.filtered.ignorePath=/src/main/resources/static,/src/main/resources/i18n
# \u9700\u8981\u5FFD\u7565\u7684\u2F42\u4EF6,\u2F63\u6210\u4EE3\u7801\u65F6\u8FD9\u4E9B\u2F42\u4EF6\u4F1A\u88AB\u8FC7\u6EE4\u6389,\u4E0D\u4F1A\u2F63\u6210\u5230\u2F6C\u6807\u2F2F\u7A0B\u4E2D
archetype.excludePatterns=/target,/**/*.iml,/.idea/**/*,install-archetype.sh,archetype-metadata.xml,/.git

# \u662F\u5426\u652F\u6301\u57FA\u4E8Espring devtool\u5DE5\u5177\u8FDB\u884C\u70ED\u90E8\u7F72\uFF0C\u9ED8\u8BA4\u662F\u652F\u6301\u70ED\u90E8\u7F72\u7684\u4EE5\u52A0\u5FEB\u9884\u89C8\u53D1\u5E03\u7684\u901F\u5EA6
archetype.spring.devtool.enable=true 
# \u662F\u5426\u652F\u6301gradle\u7F16\u8BD1,\u9ED8\u8BA4\u652F\u6301\uFF0Cgradle\u53EF\u4EE5\u589E\u91CF\u7F16\u8BD1\u52A0\u5FEB\u9884\u89C8\u53D1\u5E03\u7684\u901F\u5EA6
archetype.build.gradle=true